<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HamodaGallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <style>
        *{
            font-family: 'Noto Kufi Arabic';
        }
        li{
            list-style: none;
        }
        #heroimg{
            transition:all 1s ease;
        }
        .hero-0{
            height:300px;
            background-image: url('https://te.dynamiclayers.net/foxden/img/slider-3.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .hero-1{
            height:300px;
            background-image: url('https://te.dynamiclayers.net/foxden/img/slider-1.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .hero-2{
            height:300px;
            background-image: url('https://te.dynamiclayers.net/foxden/img/slider-2.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }
        .bg-b{
            background-color: rgba(0, 0, 0, 0.5);
        }
        header{
            position:sticky;
            top:0;
            z-index:999;
        }

        ::selection{
            color:blue;
        }
        html{
            height: 100%;
        }
        body{
            height:500px;
        }
        a{
            text-decoration: none;
            color:black
        }
        @keyframes name {
            0%{
                transform: translateX(-100%);
            }
            100%{
                transform: translateX(0%);
            }
        }
        
    </style>
</head>
<body>
    <header>
        <nav class="border-bottom border-dark bg-white border-2 p-4">
            <div class="d-flex align-items-center">
                <div id="brand" class="fw-bolder flex-grow-1 fs-5">HamodaGallery</div>
                <ul class="d-flex justify-content-around gap-4 p-0 m-0">
                    <a href="{% url 'gallery:post' %}">
                        <li class="fw-bold">نشر</li>
                    </a>
                    <a href="{% url 'gallery:home' %}">
                        <li class="fw-bold">الرئيسية</li>
                    </a>
                </ul>
            </div>
        </nav>
    </header>
    <main style="height: 100%;">
        <section class="hero-0" id="heroimg">
            <div class="w-100 h-100 bg-b d-flex justify-content-center align-items-center">
              <p class="text-white fw-bolder">
                شارك أفضل الصور الفوتوغرافية
              </p>
            </div>
        </section>
        <div class="container d-flex justify-content-center align-items-center h-100">
            <div class="card  fw-bolder w-75 w-md-50 my-3 shadow mx-auto">
                <form method="post" class="form" action="" enctype="multipart/form-data" class="d-flex justify-content-center flex-column gap-3">
                    {% csrf_token %}
                    <div class="form-container w-100 d-flex justify-content-center align-items-center flex-column gap-2 my-2">

                        <label for="name" class="text-center">صاحب الصورة</label>
                        <input type="text" placeholder="حمودة" class="form-control text-center w-100 " name="uploadername" id="name">
                    </div>
                    <div class="form-container w-100 d-flex justify-content-center align-items-center flex-column gap-2 my-2">

                        <label for="desc" class="text-center">التفاصيل</label>
                        <textarea placeholder="تفاصيل الصورة بتاعتي" class="form-control w-100 w-md-25 text-center" name="details" id="desc" style="max-height: 200px;"></textarea>
                    </div>
                    <div class="form-container w-100 d-flex justify-content-center align-items-center flex-column gap-2 my-2">

                        <label for="pic" class="text-center">الصورة</label>
                        <input type="file" class="form-control w-100 w-md-25" name="image" id="pic">
                    </div>

                    <div class="form-container w-100 d-flex justify-content-center align-items-center flex-column gap-2 my-2">

                        <label for="picname" class="text-center">اسم الصورة</label>
                        <input type="text" class="form-control w-100 w-md-25" name="picname" id="picname">
                    </div>
                        <button type="submit" class="btn btn-primary w-100">حفظ</button>
                </form>
            </div>
        </div>
    </main>
    <footer>

    </footer>
    <script>
        let index=0;
        setInterval(()=>{
            index+=1
            if(index>2){
                index=0
            }
            if(index==0){
                $('#heroimg').removeClass(`hero-1 hero-2`)
            }else if(index==1){
                $('#heroimg').removeClass(`hero-2 hero-0`)
            }else if(index==2){
                $('#heroimg').removeClass(`hero-1 hero-0`)
            }
            $('#heroimg').toggleClass(`hero-${index}`)
        
        },2500)
    </script>
</body>
</html>
